name: CI

on: [push, pull_request]

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_skills.py
      - run: python scripts/test_bolt_circle.py
      - run: python -m unittest discover -s skills/cadcraft-floor-plan/tests -v
